  - heading "♣ Account Commands" [level=4] [ref=e246]
  - paragraph [ref=e247]: "AccountsAdd - adds a new player account. The player's primary and secondary balances will be set automatically to the default \"Starting balance\" specified in the system settings and returned as \"Balance\" and \"Balance2\" parameters in the response. Required parameters are Player, Location, Email, and either PW or PWHash. Other parameters not specified will be assigned a default value:"
  - list [ref=e248]:
    - listitem [ref=e249]: "Player - 3 to 12 character player name (allowed: a to z, A to Z, 0 to 9, underscore, and dash)"
    - listitem [ref=e250]: Creator - Name of admin that created account
    - listitem [ref=e251]: AdminProfile - Admin profile name (Gold feature)
    - listitem [ref=e252]: Title - 0 to 15 characters
    - listitem [ref=e253]: Level - 0 to 50 characters
    - listitem [ref=e254]: RealName - optional real name, up to 25 characters
    - listitem [ref=e255]: PW - player's password to be hashed, leave blank if PWHash specified
    - listitem [ref=e256]: PWHash - password hash, use this only when transferring or restoring an account from backup
    - listitem [ref=e257]: Gender - Male, Female, or Unspecified
    - listitem [ref=e258]: Location - 0 to 50 character player location
    - listitem [ref=e259]: Balance - primary account balance (leave blank to use default starting balance)
    - listitem [ref=e260]: Balance2 - secondary account balance (leave blank to use default starting balance)
    - listitem [ref=e261]: LastReset - YYYY-MM-DD HH:MM date format (primary, optional, defaults to current date and time)
    - listitem [ref=e262]: LastReset2 - YYYY-MM-DD HH:MM date format (secondary, optional, defaults to current date and time)
    - listitem [ref=e263]: Permissions - comma-separated list of permission tokens
    - listitem [ref=e264]: Tickets - comma-separated list of tournament ticket tokens
    - listitem [ref=e265]: ChipsTransfer - Yes or No (primary, default is Yes)
    - listitem [ref=e266]: ChipsTransfer2 - Yes or No (secondary, default is Yes)
    - listitem [ref=e267]: ChipsAccept - Yes or No (primary, default is Yes)
    - listitem [ref=e268]: ChipsAccept2 - Yes or No (secondary, default is Yes)
    - listitem [ref=e269]: Suspend - YYYY-MM-DD HH:MM date format (leave blank for default 0000-00-00 00:00)
    - listitem [ref=e270]: Chat - date in the format of YYYY-MM-DD HH:MM, representing the date and time when the player's chat privileges are enabled. You may also specify Yes for 0000-00-00 00:00 or No for 9999-99-99 99:99
    - listitem [ref=e271]: "ChatColor1 - optional seated chat color, #RRGGBB format (Pro/Gold feature)"
    - listitem [ref=e272]: "ChatColor2 - optional observer chat color, #RRGGBB format (Pro/Gold feature)"
    - listitem [ref=e273]: FirstLogin - YYYY-MM-DD HH:MM date format (optional, defaults to 0000-00-00 00:00)
    - listitem [ref=e274]: LastLogin - YYYY-MM-DD HH:MM date format (optional, defaults to 0000-00-00 00:00)
    - listitem [ref=e275]: Logins - number of times player has logged in (optional, defaults to 0)
    - listitem [ref=e276]: Email - player's email address
    - listitem [ref=e277]: ValCode - optional 8 digit hexadecimal number used for email validation
    - listitem [ref=e278]: Avatar - a number from 0 to 64
    - listitem [ref=e279]: AvatarFile - optional avatar file path (Pro/Gold feature)
    - listitem [ref=e280]: "Custom1 - optional custom field #1"
    - listitem [ref=e281]: "Custom2 - optional custom field #2"
    - listitem [ref=e282]: "Custom3 - optional custom field #3"
    - listitem [ref=e283]: "Custom4 - optional custom field #4"
    - listitem [ref=e284]: "Custom5 - optional custom field #5"
    - listitem [ref=e285]: Note - optional note field
    - listitem [ref=e286]: ERake - equal primary rake contributions (optional, defaults to 0)
    - listitem [ref=e287]: ERake2 - equal secondary rake contributions (optional, defaults to 0)
    - listitem [ref=e288]: PRake - proportional primary rake contributions (optional, defaults to 0)
    - listitem [ref=e289]: PRake2 - proportional secondary rake contributions (optional, defaults to 0)
    - listitem [ref=e290]: TFees - primary tournament fee contributions (optional, defaults to 0)
    - listitem [ref=e291]: TFees2 - secondary tournament fee contributions (optional, defaults to 0)
  - paragraph
  - paragraph [ref=e292]: "AccountsDecBalance - decrements the primary account balance of a player. This command does not check to see if you have \"Allow negative balance\" turned on or not in the account settings. An \"Amount\" parameter is included in the response that specifies the number of chips that were actually subtracted. A \"Balance\" parameter is returned with the player's new chip balance. This command is safe to use even while the player is logged in and playing. Required parameters are Player and Amount:"
  - list [ref=e293]:
    - listitem [ref=e294]: Player - account name
    - listitem [ref=e295]: Amount - number of chips to subtract from account
    - listitem [ref=e296]: Negative - optional parameter set to "Allow", "Zero", or "Skip". Use Allow (the default) to let the player's balance go below 0. Use Zero to reset the account to 0 if the command results in a negative balance. Use Skip to not subtract any chips if the result would be a negative balance.
  - paragraph [ref=e297]: "AccountsDecBalance2 - decrements the secondary account balance of a player. This command does not check to see if you have \"Allow negative balance\" turned on or not in the account settings. An \"Amount\" parameter is included in the response that specifies the number of chips that were actually subtracted. A \"Balance2\" parameter is returned with the player's new chip balance. This command is safe to use even while the player is logged in and playing. Required parameters are Player and Amount:"
  - list [ref=e298]:
    - listitem [ref=e299]: Player - account name
    - listitem [ref=e300]: Amount - number of chips to subtract from account
    - listitem [ref=e301]: Negative - optional parameter set to "Allow", "Zero", or "Skip". Use Allow (the default) to let the player's balance go below 0. Use Zero to reset the account to 0 if the command results in a negative balance. Use Skip to not subtract any chips if the result would be a negative balance.
  - paragraph [ref=e302]: AccountsDelete - deletes the specified account. Player is the only required parameter.
  - paragraph [ref=e303]: AccountsEdit - change one or more settings in a player account. Player is the only required parameter and cannot be changed itself. Include other parameters only for the items you want to change. Parameters not included will retain their current values.
  - list [ref=e304]:
    - listitem [ref=e305]: Player - account name (required)
    - listitem [ref=e306]: Creator - Name of admin that created account
    - listitem [ref=e307]: AdminProfile - Admin profile name (Gold feature)
    - listitem [ref=e308]: Title - 0 to 15 characters
    - listitem [ref=e309]: Level - 0 to 50 characters
    - listitem [ref=e310]: RealName - real name, up to 25 characters
    - listitem [ref=e311]: PW - player's password to be hashed, leave blank if PWHash specified
    - listitem [ref=e312]: PWHash - password hash, use this only when transferring or restoring an account from backup
    - listitem [ref=e313]: Gender - Male, Female, Unspecified
    - listitem [ref=e314]: Location - 0 to 50 character player location
    - listitem [ref=e315]: Balance - primary account balance (avoid setting this parameter when player is logged in)
    - listitem [ref=e316]: Balance2 - secondary account balance (avoid setting this parameter when player is logged in)
    - listitem [ref=e317]: LastReset - date in the format of yyyy-mm-dd hh:mm
    - listitem [ref=e318]: LastReset2 - date in the format of yyyy-mm-dd hh:mm
    - listitem [ref=e319]: Permissions - comma-separated list of permission tokens
    - listitem [ref=e320]: Tickets - comma-separated list of tournament ticket tokens
    - listitem [ref=e321]: ChipsTransfer - Yes or No
    - listitem [ref=e322]: ChipsTransfer2 - Yes or No
    - listitem [ref=e323]: ChipsAccept - Yes or No
    - listitem [ref=e324]: ChipsAccept2 - Yes or No
    - listitem [ref=e325]: Suspend - YYYY-MM-DD HH:MM date format (leave blank for default 0000-00-00 00:00)
    - listitem [ref=e326]: Chat - date in the format of YYYY-MM-DD HH:MM, representing the date and time when the player's chat privileges are enabled. Use 0000-00-00 00:00 to enable immediately or 9999-99-99 99:99 for an indefinite ban
    - listitem [ref=e327]: "ChatColor1 - optional seated chat color, #RRGGBB format (Pro/Gold feature)"
    - listitem [ref=e328]: "ChatColor2 - optional observer chat color, #RRGGBB format (Pro/Gold feature)"
    - listitem [ref=e329]: FirstLogin - date in the format of yyyy-mm-dd hh:mm
    - listitem [ref=e330]: LastLogin - date in the format of yyyy-mm-dd hh:mm
    - listitem [ref=e331]: Logins - the number of times the player has logged in
    - listitem [ref=e332]: Email - player's email address
    - listitem [ref=e333]: ValCode - 8 digit hexadecimal number used for email validation
    - listitem [ref=e334]: Avatar - a number from 0 to 64
    - listitem [ref=e335]: AvatarFile - optional avatar file path (Pro/Gold feature)
    - listitem [ref=e336]: "Custom1 - optional custom field #1"
    - listitem [ref=e337]: "Custom2 - optional custom field #2"
    - listitem [ref=e338]: "Custom3 - optional custom field #3"
    - listitem [ref=e339]: "Custom4 - optional custom field #4"
    - listitem [ref=e340]: "Custom5 - optional custom field #5"
    - listitem [ref=e341]: Note - optional note field
    - listitem [ref=e342]: ERake - equal primary rake contributions
    - listitem [ref=e343]: ERake2 - equal secondary rake contributions
    - listitem [ref=e344]: PRake - proportional primary rake contributions
    - listitem [ref=e345]: PRake2 - proportional secondary rake contributions
    - listitem [ref=e346]: TFees - primary tournament fee contributions
    - listitem [ref=e347]: TFees2 - secondary tournament fee contributions
  - paragraph [ref=e348]: "AccountsGet - retrieves settings for the account specified by the Player parameter (required). In additional, a non-blank SessionID will be returned if the player is currently logged in. If they are seated at any ring games, the total amount of chips they have in play will be returned with the RingChips parameter. If they are in the waiting list for any tournaments that have not yet started, the total buy-in and entry fee amounts will be returned with the RegChips parameter. A typical response will look something like this (JSON format):"
  - generic [ref=e349]: "{\"Result\":\"Ok\",\"Player\":\"AceMan\",\"Creator\":\"Administrator\",\"AdminProfile\":\"\",\"Title\":\"\",\"Level\":\"\",\"RealName\":\"Joe K.\",\"PWHash\":\"DE6D9A49-38129B6ECA0328ED6E48879699AD740FC2C7C4E4977D5DC527A99D99FCDCEDDF\",\"Gender\":\"Male\",\"Location\":\"Springfield\",\"Balance\":25020,\"Balance2\":1000,\"LastReset\":\"2008-08-25 19:16\",\"LastReset2\":\"0000-00-00 00:00\",\"Permissions\":\"d43, test678\",\"Tickets\":\"\",\"ChipsTransfer\":\"Yes\",\"ChipsTransfer2\":\"Yes\",\"ChipsAccept\":\"Yes\",\"ChipsAccept2\":\"Yes\",\"Suspend\":\"0000-00-00 00:00\",Chat\":\"0000-00-00 00:00\",\"ChatColor1\":\"\",\"ChatColor2\":\"\",\"FirstLogin\":\"2008-12-08 20:43\",\"LastLogin\":\"2018-09-01 15:04\",\"Logins\":47,\"Email\":\"joe@hotmail.com\",\"ValCode\":\"\",\"Avatar\":46,\"AvatarFile\":\"\",\"Custom1\":\"\",\"Custom2\":\"\",\"Custom3\":\"\",\"Custom4\":\"\",\"Custom5\":\"\",\"Note\":\"\",\"ERake\":6,\"ERake2\":0,\"PRake\":6,\"PRake2\":0,\"TFees\":0,\"TFees2\":0,\"RingChips\":0,\"RingChips2\":0,\"RegChips\":0,\"RegChips2\":0,\"SessionID\":\"\"}"
  - paragraph [ref=e350]: "or in legacy format:"
  - generic [ref=e351]: Result=Ok Player=AceMan Creator=Administrator AdminProfile= Title= Level= RealName=Joe K. PWHash=DE6D9A49-38129B6ECA0328ED6E48879699AD740FC2C7C4E4977D5DC527A99D99FCDCEDDF Gender=Male Location=Springfield Balance=25020 Balance2=1000 LastReset=2008-08-25 19:16 LastReset2=0000-00-00 00:00 Permissions=d43, test678 Tickets= ChipsTransfer=Yes ChipsTransfer2=Yes ChipsAccept=Yes ChipsAccept2=Yes Suspend=0000-00-00 00:00 Chat=0000-00-00 00:00 ChatColor1= ChatColor2= FirstLogin=2008-12-08 20:43 LastLogin=2018-09-01 15:04 Logins=47 Email=joe@hotmail.com ValCode= Avatar=46 AvatarFile= Custom1= Custom2= Custom3= Custom4= Custom5= Note= ERake=6 ERake2=0 PRake=6 PRake2=0 TFees=0 TFees2=0 RingChips=0 RingChips2=0 RegChips=0 RegChips2=0 SessionID=
  - paragraph [ref=e352]: AccountsIncBalance - increments the primary account balance of a player. Use a Player parameter to specify the player's name and an Amount parameter to specify the number of chips to add to the account. A "Balance" parameter is returned in the result indicating the player's new chip balance. This command is safe to use even while the player is logged in and playing. Required parameters are Player and Amount.
  - paragraph [ref=e353]: AccountsIncBalance2 - increments the secondary account balance of a player. Use a Player parameter to specify the player's name and an Amount parameter to specify the number of chips to add to the account. A "Balance2" parameter is returned in the result indicating the player's new chip balance. This command is safe to use even while the player is logged in and playing. Required parameters are Player and Amount.
  - paragraph [ref=e354]: "AccountsList - retrieves a list of player accounts. Calling this with no parameters will just return the number of accounts. Set an optional Players field with a comma separated list (no spaces) of player names. Leave this field blank to retrieve all player accounts. Set the Fields parameter to a comma separated list (no spaces) of field names that you want returned. You may choose any combination of these fields:"
  - paragraph [ref=e355]: Player, Creator, AdminProfile, Title, Level, RealName, PWHash, Location, Email, ValCode, Balance, Balance2, LastReset, LastReset2, Avatar, AvatarFile, Logins, FirstLogin, LastLogin, Gender, Permissions, Tickets, ChipsTransfer, ChipsTransfer2, ChipsAccept, ChipsAccept2, Suspend, Chat, ChatColor1, ChatColor2, Custom1, Custom2, Custom3, Custom4, Custom5, Note, ERake, ERake2, PRake, PRake2, TFees, TFees2.
  - paragraph [ref=e356]: "In addition, you may include these live look-up fields. Doing so may significantly increase the processing time of the command, depending on the number of accounts, logins, and tables:"
  - paragraph [ref=e357]: RingChips, RingChips2, RegChips, RegChips2, SessionID
  - paragraph [ref=e358]: "A sample response with \"Fields=Player,Balance\" may look something like this (JSON format):"
  - generic [ref=e359]: "{\"Result\":\"Ok\",\"Accounts\":3,\"Player\":[\"Aces123\",\"BoneCrusher\",\"David\"],\"Balance\":[2345,3470,1000]}"
  - paragraph [ref=e360]: "or in legacy format:"
  - generic [ref=e361]: Result=Ok Accounts=3 Player1=Aces123 Balance1=2345 Player2=BoneCrusher Balance2=3470 Player3=David Balance3=1000
  - paragraph [ref=e362]: "AccountsNotes - Retrieves or sets the player notes written by a specified player about other players. The purpose of this command is for data backup or account transfers to another server. Player notes should be treated as private and confidential. Use a Player parameter to specify the player's name (the author of the notes), an Encrypted parameter set to \"Yes\" (or \"No\" when loading notes made prior to version 7), and an Action parameter with the value \"Get\", \"Set\", or \"Add\". Get retrieves all of the player notes written by the specified player. Required parameters are Player and Action (and possibly Data as described below). A sample response may look something like this (JSON format):"
  - generic [ref=e363]: "{\"Result\":\"Ok\",\"Player\":\"Lady-X\",\"Count\":2,\"Label\":[],\"Subject\":[\"Aces123\",\"BoneCrusher\"],\"Color\":[\"4\",\"1\"],\"Chat\":[\"Yes\",\"Yes\"],\"Note\":[\"\",\"test\"]}"
  - paragraph [ref=e364]: "or in legacy format:"
  - generic [ref=e365]: Result=Ok Player=Lady-X Count=2 Subject1=Aces123 Color1=4 Chat1=Yes Note1= Subject2=BoneCrusher Color2=1 Chat2=Yes Note2=test
  - paragraph [ref=e366]: When the Action parameter is "Set", use a Data parameter that contains a note set in JSON format (same as returned by the Get action). This will delete all of the player's existing notes and replace them with those specified in the Data parameter. Use a blank Data parameter to just delete all of a player's notes. When the Action parameter is "Add", the note set in the Data parameter is added to the player's existing notes and will only overwrite notes if they target the same subject.
  - paragraph [ref=e367]: "AccountsPassword - verifies a player's password. Use a Player parameter to specify a player's name and a PW parameter for the player's password. The password will be hashed by the server and compared to the stored hash. Required parameters are Player and PW. If the hashes match the result will be (JSON format):"
  - generic [ref=e368]: "{\"Result\":\"Ok\",\"Verified\":\"Yes\"}"
  - paragraph [ref=e369]: "or in legacy format:"
  - generic [ref=e370]: Result=Ok Verified=Yes
  - paragraph [ref=e371]: "AccountsPermission - add, remove, or query individual permissions for a specified player. Use a Player parameter to specify the account, a Permission parameter for the permission token, and an Action parameter set to either \"Add\", \"Remove\", or \"Query\". Required parameters are Player, Permission, and Action. The Add and Remove actions will return a Result = Ok response if successful. The Query action will return a Yes or No response indicating if the player has the specified permission (JSON format):"
  - paragraph
  - generic [ref=e372]: "{\"Result\":\"Ok\",\"Query\":\"Yes\"}"
  - paragraph [ref=e373]: "or in legacy format:"
  - generic [ref=e374]: Result=Ok Query=Yes
  - paragraph [ref=e375]: Note that if you want to get or replace a player's full list of permissions, use the AccountsGet and AccountsEdit commands.
  - paragraph [ref=e376]: "AccountsSearch- returns the list of ring games and tournaments for a player specified by the Player parameter (required) where they are currently seated or in the waiting list. A typical response will look something like this (JSON format):"
  - generic [ref=e377]: "{\"Result\":\"Ok\",\"Player\":\"Aces123\",\"LoggedIn\":\"Yes\",\"RingWaitCount\":1,\"RingPlayCount\":2,\"TrnyRegCount\":1,\"TrnyPlayCount\":2,\"RingWaitName\":[\"Ring Game #01\"],\"RingPlayName\":[\"Ring Game #02\",\"Ring Game #03\"],\"RingPlayChips\":[1250, 1500],\"TrnyRegName\":[\"Tournament #01\"],\"TrnyRegChips\":[1500],\"TrnyPlayName\":[\"Tournament #02\", \"Tournament #03\"],\"TrnyPlayTable\":[2,6]}"
  - paragraph [ref=e378]: "or in legacy format:"
  - generic [ref=e379]: "Result=Ok Player=Aces123 LoggedIn=Yes RingWaitCount=1 RingPlayCount=2 TrnyRegCount=1 TrnyPlayCount=2 RingWaitName1=Ring Game #01 RingPlayName1=Ring Game #02 RingPlayName2=Ring Game #03 RingPlayChips1=1250 RingPlayChips2=1500 TrnyRegName1=Tournament #01 TrnyRegChips1=1500 TrnyPlayName1=Tournament #02 TrnyPlayName2=Tournament #03 TrnyPlayTable1=2 TrnyPlayTable2=6"
  - paragraph [ref=e380]: "AccountsSessionKey - creates a random 80-bit session key for a player specified by the Player parameter (required). The session key serves as a one-time-only password for an automated login. See the Technical Information/Startup Parameters topic for instructions on using session keys. A typical response will look something like this (JSON format):"
  - generic [ref=e381]: "{\"Result\":\"Ok\",\"Player\":\"Aces123\",\"SessionKey\":\"1234567890ABCDEF1234\"}"
  - paragraph [ref=e382]: "or in legacy format:"
  - generic [ref=e383]: Result=Ok Player=Aces123 SessionKey=1234567890ABCDEF1234
  - paragraph [ref=e384]: "AccountsTicket - add, remove, or query individual tournament tickets for a specified player. Use a Player parameter to specify the account, a Ticket parameter for the ticket token, and an Action parameter set to either \"Add\", \"Remove\", or \"Query\". Required parameters are Player, Ticket, and Action. The Add and Remove actions will return a Result = Ok response if successful. The Query action will return a Yes or No response (and a Count parameter beginning with version 5.09) indicating if the player has the specified ticket (JSON format):"
  - paragraph
  - generic [ref=e385]: "{\"Result\":\"Ok\",\"Query\":\"Yes\",\"Count\":1}"
  - paragraph [ref=e386]: "or in legacy format:"
  - generic [ref=e387]: Result=Ok Query=Yes Count=1
  - paragraph [ref=e388]: Note that if you want to get or replace a player's full list of tickets, use the AccountsGet and AccountsEdit commands.
  - paragraph [ref=e389]: "AccountsTransactions - query the player account transactions database (PlayerData.db). Use a Player parameter to specify the account (leave blank for all accounts), a DateStart parameter (defaults to 0000-00-00 00:00:00), a DateEnd parameter (defaults to 9999-99-99 99:99:99), and a UTC parameter, set to \"Yes\" to convert resulting timestamps to UTC or \"No\" (the default) to leave resulting timestamps in the server's time zone. The DateStart and DateEnd parameters are always in the server's time zone regardless of the UTC parameter. A typical result looks like this:"
  - paragraph
  - generic [ref=e390]: "{\"Result\":\"Ok\",\"Count\":2,\"Date\":[\"2022-03-27 15:11:29\",\"2022-03-27 15:23:02\"],\"Player\":[\"BoneCrusher\",\"BoneCrusher\"],\"Currency\":[\"Primary\",\"Primary\"],\"Change\":[\"-1200\",\"1210\"],\"Balance\":[\"25801\",\"27011\"],\"Source\":[\"Ring Game #03\",\"Ring Game #03\"]}"
  - paragraph [ref=e391]: "or in legacy format:"
  - generic [ref=e392]: "Result=Ok Count=2 Date1=2022-03-27 15:11:29 Player1=BoneCrusher Currency1=Primary Change1=-1200 Balance1=25801 Source1=Ring Game #03 Date2=2022-03-27 15:23:02 Player2=BoneCrusher Currency2=Primary Change2=1210 Balance2=27011 Source2=Ring Game #03"
  - paragraph [ref=e393]: AccountsVerifyKey - verify a player's identity when using the "Player account URL" setting in the Client Settings group. That setting allows you to direct players to a custom URL from their Account menu in the Lobby. Your code must extract the "Player" and "Key" parameters that were embedded in the URL by the client interface. Pass those two parameters to this API call and look for an "Ok" result before performing any further action for that player account.
  - paragraph
  - heading "♣ Blacklist Commands" [level=4] [ref=e394]
  - paragraph [ref=e395]: BlacklistAdd - add a new entry into the player blacklist. You must specify at least one parameter in the group of Player, IP, and PC.
  - list [ref=e396]:
    - listitem [ref=e397]: Date - optional date in the format of yyyy-mm-dd hh:mm, otherwise the current date will be used.
    - listitem [ref=e398]: Player - player's name
    - listitem [ref=e399]: IP - player's IP address
    - listitem [ref=e400]: PC - player's computer ID in 8-digit hexadecimal format
    - listitem [ref=e401]: Match - this is either "All" or "Any"
    - listitem [ref=e402]: Note - optional note
  - paragraph [ref=e403]: BlacklistDelete - deletes an item from the blacklist. Specify the item with an ID parameter (required).
  - paragraph [ref=e404]: BlacklistEdit - edit one or more fields for a blacklist item, as specified with an ID parameter (required). Other than the ID, only include parameters for the fields you want to change, otherwise the field will retain its current value.
  - list [ref=e405]:
    - listitem [ref=e406]: Date- date in the format of yyyy-mm-dd hh:mm
    - listitem [ref=e407]: Player - player's name
    - listitem [ref=e408]: IP - player's IP address
    - listitem [ref=e409]: PC - player's computer ID in 8-digit hexadecimal format
    - listitem [ref=e410]: Match - this is either "All" or "Any"
    - listitem [ref=e411]: Note - optional note
  - paragraph [ref=e412]: "BlacklistGet - retrieves the fields for the specified blacklist item, as determined by an ID parameter (required). A sample response may look something like this (JSON format):"
  - generic [ref=e413]: "{\"Result\":\"Ok\",\"ID\":\"00000001\",\"Date\":\"2008-06-20 08:17:01\",\"Player\":\"DeathBot\",\"IP\":\"12.34.56.789\",\"PC\":\"12345678\",\"Match\":\"Any\",\"Note\":\"Abusive player\"}"
  - paragraph [ref=e414]: "or in legacy format:"
  - generic [ref=e415]: Result=Ok ID=00000001 Date=2008-06-20 08:17:01 Player=DeathBot IP=12.34.56.789 PC=12345678 Match=Any Note=Abusive player
  - paragraph [ref=e416]: "BlacklistList - retrieves a list of all blacklist entries. Calling this with no parameters will just return a count of entries. Set the Fields parameter to a comma separated list of field names that you want returned. Do not include spaces in the list. You may choose any combination of these fields:"
  - paragraph [ref=e417]: ID, Date, Player, IP, PC, Match, Note
  - paragraph [ref=e418]: "A sample response with \"Fields=ID,Player,IP\" may look something like this (JSON format):"
  - generic [ref=e419]: "{\"Result\":\"Ok\",\"Count\":2,\"ID\":[\"00000001\",\"00000002\"],\"Player\":[\"DeathBot\",\"TroubleMaker\"],\"IP\":[\"12.34.56.789\",\"98.76.54.321\"]}"
  - paragraph [ref=e420]: "or in legacy format:"
  - generic [ref=e421]: Result=Ok Count=2 ID1=00000001 Player1=DeathBot IP1=12.34.56.789 ID2=00000002 Player2=TroubleMaker IP2=98.76.54.321
  - heading "♣ Connection Commands" [level=4] [ref=e422]
  - paragraph [ref=e423]: "ConnectionsGet - retrieves values for the connection specified by the SessionID parameter (required). A typical response will look something like this (JSON format):"
  - generic [ref=e424]: "{\"Result\":\"Ok\",\"SessionID\":\"00000001\",\"Status\":\"Ok\",\"Player\":\"Aces123\",\"Lang\":0,\"PC\":\"12345678\",\"IP\":\"12.34.56.789\",\"Proxy\":\"\",\"Connect\":\"2015-01-22 14:07:23\",\"Login\":\"2015-01-22 14:24:56\",\"LastAction\":\"2015-01-22 14:52:01\",\"PacketsIn\":123,\"PacketsOut\":890}"
  - paragraph [ref=e425]: "or in legacy format:"
  - generic [ref=e426]: Result=Ok SessionID=00000001 Status=Ok Player=Aces123 Lang=0 PC=12345678 IP=12.34.56.789 Proxy= Connect=2015-01-22 14:07:23 Login=2015-01-22 14:24:56 LastAction=2015-01-22 14:52:01 PacketsIn=123 PacketsOut=890
  - paragraph [ref=e427]: "ConnectionsList - retrieves the list of all current connections. Calling this with no parameters will just return the number of connections. Set the Fields parameter to a comma separated list of field names that you want returned. Do not include spaces in the list. You may choose any combination of these fields:"
  - paragraph [ref=e428]: SessionID, Status, Player, Lang, PC, IP, Proxy, Connect, Login, LastAction, PacketsIn, PacketsOut
  - paragraph [ref=e429]: "A sample response with \"Fields=Player,IP\" may look something like this (JSON format):"
  - generic [ref=e430]: "{\"Result\":\"Ok\",\"Connections\":2,\"Player\":[\"Aces123\",\"BoneCrusher\"],\"IP\":[\"12.34.56.789\",\"98.76.54.321\"]}"
  - paragraph [ref=e431]: "or in legacy format:"
  - generic [ref=e432]: Result=Ok Connections=2 Player1=Aces123 IP1=12.34.56.789 Player2=BoneCrusher IP2=98.76.54.321
  - paragraph [ref=e433]: ConnectionsMessage - sends a popup message to the person at the specified SessionID parameter (required) with the message text specified in the Message parameter (required). Use an asterisk (*) as the SessionID to send the message to all connections.
  - paragraph [ref=e434]: ConnectionsTerminate - terminates the connection at the specified SessionID parameter (required).
  - heading "♣ Log Commands" [level=4] [ref=e435]
  - paragraph [ref=e436]: LogsAddEvent - adds a line to the Event Log without performing any other command. Use the Log parameter to append custom text to the entry. Note that this Log parameter is an option with all of the other API commands, also.
  - paragraph [ref=e437]: "LogsCallback - call without any parameters to retrieve a list of dates where a callback log file was created. This command was added in version 5.17. Example output will look something like this (JSON format):"
  - generic [ref=e438]: "{\"Result\":\"Ok\",\"Files\":3,\"Date\":[\"2017-09-01\",\"2017-09-06\",\"2017-09-07\"]}"
