  - paragraph [ref=e623]: "SystemGet - gets the value for the specified Property parameter (required). For example, if you specified \"FilePort\" for the Property, a typical response would look like this (JSON format):"
  - generic [ref=e624]: "{\"Result\":\"Ok\",\"Value\":\"8087\"}"
  - paragraph [ref=e625]: "or in legacy format:"
  - generic [ref=e626]: Result=Ok Value=8087
