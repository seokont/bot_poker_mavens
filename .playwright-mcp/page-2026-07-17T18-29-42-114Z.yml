  - heading "♣ Description" [level=4] [ref=e25]
  - paragraph [ref=e26]: Poker Mavens contains an Application Programming Interface (API) for communicating with the live game server from external programs, including scripting systems like PHP and ASP.NET. Commands can also be tested by hand via any web browser but note that this system is different from the Remote Administration system, which is designed for human interaction with your server. The interface described here is for computer to computer interaction.
  - paragraph [ref=e27]: "To use this system you must have \"Enable API\" set to \"Yes\" in the server settings and your server must be started and online. It works by making an HTTP request to the HTTP port of your server with /api appended to the end of the URL (or a custom path that you can change in the server settings). Parameters can be passed via GET (embedded in the URL) or via POST (embedded in the HTTP header). There are two parameters that must be included with each request: Password and Command. Password must be set to your API password and Command is set to one of the available commands as listed below. Other parameters may be required, depending on the particular command."
  - paragraph [ref=e28]: "Warning: disclosing your API password (or your remote administration password) would give an attacker full access to your game server, including the modification or deletion of player accounts. Only allow your program or web script to execute on a computer that you that have control over. Otherwise the operator could use a packet sniffer program to see the password being sent in the outbound traffic."
  - paragraph [ref=e29]: Commands sent to the API will be recorded in the event logs if "Log API events" is set to "Yes" in the system settings. The IP address of the source is also recorded. Every command supports an optional "Log" parameter that you can use to append custom text to each log entry. However, if that Log parameter is set to "No" and "API Log Exemptions" is enabled in the system settings, then no entry will be made in the event log.
  - heading "♣ Example" [level=4] [ref=e30]
  - paragraph [ref=e31]: "For example, if your IP is 12.34.56.789, your HTTP port is 8087, your API password is \"banana\", and you want to increment the current chip balance of a player named Aces123 by 1000 chips, then your program would make an HTTP request to:"
  - generic [ref=e32]: "http://12.34.56.789:8087/api with parameters set via POST as: Password=banana Command=AccountsIncBalance Player=Aces123 Amount=1000 Log=Give 1000 chips to Aces123 or via GET as: http://12.34.56.789:8087/api?Password=banana&Command=AccountsIncBalance&Player=Aces123&Amount=1000&Log=Give 1000 chips to Aces123"
  - paragraph [ref=e33]: The order and case of the parameters is not important but the first one must begin with a question mark and all remaining ones must be separated by an ampersand when using the GET method.
  - paragraph [ref=e34]: "The server always responds with a block of text containing a \"Result\" parameter and possibly others depending on the particular command and if there were any errors. Result will either be set to Ok or Error. If there was an error then an Error parameter will be included with a description of the error. When there are multiple parameters returned, they are separated by a carriage return/line feed pair (ASCII 13 and 10). Using the example above, a typical response will look something like this:"
  - generic [ref=e35]: Result=Ok Balance=5000
  - paragraph [ref=e36]: "And the entry into the Event Logs (with the optional Log parameter) would look something like this:"
  - generic [ref=e37]: 2008-07-20 17:06:29|API|AccountsIncBalance from 12.34.56.789 (Give 1000 chips to Aces123)
  - paragraph [ref=e38]: "Or if there was an error:"
  - generic [ref=e39]: Result=Error Error=Unknown account
  - heading "♣ JSON Support" [level=4] [ref=e40]
  - paragraph [ref=e41]: "Beginning with version 4.20, you can get the return data in JSON format by including JSON=Yes in your POST or GET parameters. Then the API would return something like this:"
  - generic [ref=e42]: "{\"Result\":\"Ok\",Balance:5000}"
  - paragraph [ref=e43]: "or this:"
  - generic [ref=e44]: "{\"Result\":\"Error\",\"Error\":\"Unknown account\"}"
  - heading "♣ PHP Example (JSON method)" [level=4] [ref=e45]
  - paragraph [ref=e46]: This function can be used in PHP from a web site to access the API and return a single object containing the results. This method requests the result in JSON format, which first became an option in version 4.20. For older versions, see the legacy method further below.
  - paragraph
  - generic [ref=e47]: "$url = \"http://127.0.0.1:8087/api\"; // put your API path here $pw = \"xxxxxxxxxx\"; // put your API password here function Poker_API($params) // pass in parameters using an associative array { global $url, $pw; $params['Password'] = $pw; $params['JSON'] = 'Yes'; $curl = curl_init($url); curl_setopt($curl, CURLOPT_POST, true); curl_setopt($curl, CURLOPT_POSTFIELDS, http_build_query($params)); curl_setopt($curl, CURLOPT_TIMEOUT, 30); curl_setopt($curl, CURLOPT_RETURNTRANSFER, true); curl_setopt($curl, CURLOPT_VERBOSE, true); curl_setopt($curl, CURLOPT_SSL_VERIFYPEER, false); $response = curl_exec($curl); if (curl_errno($curl)) $obj = (object) array('Result' => 'Error', 'Error' => curl_error($curl)); else if (empty($response)) $obj = (object) array('Result' => 'Error', 'Error' => 'Connection failed'); else $obj = json_decode($response); curl_close($curl); return $obj; }"
  - paragraph [ref=e48]: "Using the data from the previous example, you would call it like this:"
  - generic [ref=e49]: $params = array("Command" => "AccountsIncBalance", "Player" => "Aces123", "Amount" => "1000"); $api = Poker_API($params);
  - paragraph [ref=e50]: "And then process the response like this:"
  - generic [ref=e51]: "if ($api -> Result == \"Ok\") echo \"The chip balance is \" . $api -> Balance; else echo \"Error: \" . $api -> Error;"
  - paragraph [ref=e52]:
    - text: Other examples are available
    - link "online" [ref=e53] [cursor=pointer]:
      - /url: http://www.briggsoft.com/docs/pmavens/API_Examples.htm
    - text: .
  - heading "♣ PHP Example (legacy method)" [level=4] [ref=e54]
  - paragraph [ref=e55]: "This function can be used in PHP from a web site to access the API and return a regular or an associative array containing the results:"
  - paragraph
  - generic [ref=e56]: "function Poker_API($url, $params, $assoc) { $curl = curl_init($url); curl_setopt($curl, CURLOPT_POST, true); curl_setopt($curl, CURLOPT_POSTFIELDS, $params); curl_setopt($curl, CURLOPT_TIMEOUT, 30); curl_setopt($curl, CURLOPT_RETURNTRANSFER, true); curl_setopt($curl, CURLOPT_VERBOSE, true); curl_setopt($curl, CURLOPT_SSL_VERIFYPEER, false); $response = trim(curl_exec($curl)); if (curl_errno($curl)) $cerror = curl_error($curl); else $cerror = \"\"; curl_close($curl); $api = Array(); if ($assoc) // associative array result { if ($cerror != \"\") { $api[\"Result\"] = \"Error\"; $api[\"Error\"] = $cerror; } else if (empty($response)) { $api[\"Result\"] = \"Error\"; $api[\"Error\"] = \"Connection failed\"; } else { $paramlist = Explode(\"\\r\\n\", $response); foreach ($paramlist as $param) { $namevalue = Explode(\"=\", $param, 2); $api[$namevalue[0]] = $namevalue[1]; } } } else // regular array result { if ($cerror != \"\") { $api[] = \"Result=Error\"; $api[] = \"Error=\" . $cerror; } else if (empty($response)) { $api[] = \"Result=Error\"; $api[] = \"Error=Connection failed\"; } else { $paramlist = Explode(\"\\r\\n\", $response); foreach ($paramlist as $param) $api[] = $param; } } return $api; }"
  - paragraph [ref=e57]: "Using the data from the previous example, you would call it like this:"
  - generic [ref=e58]: $url = "http://12.34.56.789:8087/api"; $params = "Password=banana&Command=AccountsIncBalance&Player=Aces123&Amount=1000"; $api = Poker_API($url,$params,true);
  - paragraph [ref=e59]: "And then process the response like this:"
  - generic [ref=e60]: "if ($api[Result] == \"Ok\") echo \"The chip balance is \" . $api[Balance]; else echo \"Error: \" . $api[Error];"
  - paragraph [ref=e61]:
    - text: Other examples are available
    - link "online" [ref=e62] [cursor=pointer]:
      - /url: http://www.briggsoft.com/docs/pmavens/API_Examples2.htm
    - text: .
  - heading "♣ URL Encoding (legacy method)" [level=4] [ref=e63]
  - paragraph [ref=e64]: "Note: parameter encoding is handled for you automatically when using the JSON method (via the http_build_query function). The following only applies when using the legacy method or when manually calling the API with GET parameters."
  - paragraph [ref=e65]:
    - text: Certain characters like "?", "&", "=", "%", "#", and several others are treated as control characters in URL strings. Therefore you must encode any parameter values that contain those characters using the form %xx where xx is the ASCII code of the character in hexadecimal format, in accordance with section 2.2 of
    - link "RFC1738" [ref=e66] [cursor=pointer]:
      - /url: http://www.faqs.org/rfcs/rfc1738.html
    - text: ". For example, if you wanted to retrieve the tournament results for a tournament called \"Rough&Ready\", using the raw parameter of:"
  - generic [ref=e67]: Tournament=Rough&Ready
  - paragraph [ref=e68]: "would fail because the \"&\" would indicate the beginning of a new parameter. The ASCII code for \"&\" is 38 decimal or 26 hexadecimal so the proper encoding would be:"
  - generic [ref=e69]: Tournament=Rough%26Ready
  - paragraph [ref=e70]: Most programming languages have built-in functions for encoding URL parameters. In PHP (for example), the function is urlencode(string) or rawurlencode(string).
  - heading "♣ Firewall" [level=4] [ref=e71]
  - paragraph [ref=e72]: Some hosting services will have a default firewall setting that blocks connections to outbound ports other than 80 and 443, the standard HTTP/HTTPS ports. So if you can make a manual API connection in your web browser to port 8087 (or whatever HTTP Port you have set) but get a "Connection failed" result when using scripted code, that firewall is likely the reason. Talk to your host provider (where the script is hosted) and see if they will open that port for outbound connections in your account.
  - heading "♣ Avatars" [level=4] [ref=e73]
  - paragraph [ref=e74]: "Although not technically part of the API, the server provides access to the communal avatar graphic and individual custom player avatars so that you can display them for the purposes of creating or editing player accounts. No API password is required so this can be safely used in public links on a web page. To pull the whole communal avatar graphic, simply reference a link like this (with your own IP address or domain name):"
  - generic [ref=e75]: http://12.34.56.789:8087/Image?Name=Avatars
  - paragraph [ref=e76]: "To isolate a single avatar in the horizontal strip, use a DIV element set to a width and height of 64 pixels (48 pixels in versions 2, 3, and 4, 32 pixels in versions 5 and 6) and then use the CSS background-position property to specify a horizontal offset. This will be a negative number and a multiple of 64 pixels such that the first avatar will have a background-position of \"0px 0px\", the second will be \"-64px 0px\", the third will be \"-128px 0px\", etc. This example will display the third one:"
  - generic [ref=e77]: "<!DOCTYPE html> <html> <head> <style type=\"text/css\"> #avatar { width: 64px; height: 64px; background-image: url(\"http://12.34.56.789:8087/Image?Name=Avatars\"); background-repeat: no-repeat; background-position: -128px 0px; } </style> </head> <body> <div id=\"avatar\"></div> </body> </html>"
  - paragraph [ref=e78]: "For the custom player avatars (not part of the communal set), you just need a simple link with the player's name as one of the parameters:"
  - generic [ref=e79]: http://12.34.56.789:8087/Avatar?Player=AceMan
