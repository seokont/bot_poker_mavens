  - paragraph [ref=e918]: SystemLobbyMessage - sends a message to the Lobby chat box. Put the text of the message in the Message parameter (required). Specify an optional Player parameter to send the message from a specific player account (which must exist but does not need to be logged in) or leave blank to send the message from the Administrator.
  - paragraph [ref=e919]: SystemReboot - reboots the computer immediately. This command does not attempt an orderly shutdown of active tables.
  - paragraph [ref=e920]: SystemSet - sets the Value of the specified system Property (both parameters required). For example, to turn off the login chime, set the Property parameter to "LoginChime" and the Value parameter to "No". See the SystemGet command above for a list of all available system property names. Properties marked as "read-only" cannot be changed while the game server is online.
  - paragraph [ref=e921]: "SystemStats - returns the following parameters related to the current server statistics:"
  - list [ref=e922]:
    - listitem [ref=e923]: Logins - the number of players logged in
    - listitem [ref=e924]: FilledSeats - the number of seats currently filled
    - listitem [ref=e925]: RunningRing - the number of running ring tables
    - listitem [ref=e926]: RunningTrny - the number of running tournaments
    - listitem [ref=e927]: Memory - amount of memory (in kilobytes) used by the poker server module
    - listitem [ref=e928]: Threads - current number of threads used by the poker server module
    - listitem [ref=e929]: CPU - the percentage of CPU time used by the poker server module
    - listitem [ref=e930]: UpSeconds - the number of seconds since the game server was put online
    - listitem [ref=e931]: UpTime - a string in the format of "x days x hrs x mins" indicating how long the game server has been running
    - listitem [ref=e932]: LocalTime - a string in the format of "yyyy-mm-dd hh:mm:ss" showing the server's local time
    - listitem [ref=e933]: UTCTime - a string in the format of "yyyy-mm-dd hh:mm:ss" showing the server's local time, converted to UTC
    - listitem [ref=e934]: DiskFree - the number of free bytes available on the drive where the data folder is located
    - listitem [ref=e935]: Version - server version number
    - listitem [ref=e936]: License - Trial, Lite, Pro, or Gold
  - heading "♣ Tournament Commands" [level=4] [ref=e937]
  - paragraph [ref=e938]: "TournamentsAdd - adds a new tournament to the system. The newly created game will be in an offline state. Name is the only required parameter. Other parameters not specified will receive default values:"
  - list [ref=e939]:
    - listitem [ref=e940]: Name - a unique name, from 1 to 40 characters
    - listitem [ref=e941]: Creator - name of admin that create game
    - listitem [ref=e942]: Description - optional tournament description, up to 500 characters
    - listitem [ref=e943]: Auto - set to "Yes" or "No" to put game online when server is started
    - listitem [ref=e944]: Game - specify "Limit Hold'em", "Pot Limit Hold'em", "No Limit Hold'em", "Pot Limit 6+Hold'em", "No Limit 6+Hold'em", "Limit Omaha", "Pot Limit Omaha", "No Limit Omaha", "Limit Omaha Hi-Lo", "Pot Limit Omaha Hi-Lo", "No Limit Omaha Hi-Lo", "Limit Omaha-5", "Pot Limit Omaha-5", "No Limit Omaha-5", "Limit Omaha-5 Hi-Lo", "Pot Limit Omaha-5 Hi-Lo", "No Limit Omaha-5 Hi-Lo", "Limit Omaha-6", "Pot Limit Omaha-6", "No Limit Omaha-6", "Limit Omaha-6 Hi-Lo", "Pot Limit Omaha-6 Hi-Lo", "No Limit Omaha-6 Hi-Lo", "Limit Courchevel", "Pot Limit Courchevel", "No Limit Courchevel", "Limit Courchevel Hi-Lo", "Pot Limit Courchevel Hi-Lo", "No Limit Courchevel Hi-Lo", "Limit Razz", "Limit Stud", "Limit Stud Hi-Lo", "Mixed"
    - listitem [ref=e945]: MixedList - if Game is set to "Mixed" then this field must contain a comma-separated list of two or more game types
    - listitem [ref=e946]: Shootout - set to "Yes" for a shootout format or "No" for a standard format
    - listitem [ref=e947]: PW - (optional) specify a password needed to register
    - listitem [ref=e948]: Private - set to "Yes" to prevent observing without the password or "No" to allow observers
    - listitem [ref=e949]: PermRegister - register permission token, 15 alphanumeric characters max
    - listitem [ref=e950]: PermUnregister - unregister permission token, 15 alphanumeric characters max
    - listitem [ref=e951]: PermObserve - observe permission token, 15 alphanumeric characters max
    - listitem [ref=e952]: PermPlayerChat - player chat permission token, 15 alphanumeric characters max
    - listitem [ref=e953]: PermObserverChat - observer chat permission token, 15 alphanumeric characters max
    - listitem [ref=e954]: SuspendChatAllIn - either "Yes" or "No"
    - listitem [ref=e955]: Seats - number of seats per table, from 2 to 10
    - listitem [ref=e956]: MaxEntrants - multiple of seat count, 2 to 1000
    - listitem [ref=e957]: StartFull - either "Yes" or "No"
    - listitem [ref=e958]: StartOnDemand - either "Yes" or "No"
    - listitem [ref=e959]: StartMin - number from 0 to 10
    - listitem [ref=e960]: StartCode - number from 0 (disabled) to 999999
    - listitem [ref=e961]: StartTime - yyyy-mm-dd hh:mm format (0000-00-00 00:00 = disabled)
    - listitem [ref=e962]: RegMinutes - number of minutes, 0 to 999999
    - listitem [ref=e963]: LateRegMinutes - number of minutes, 0 to 999999
    - listitem [ref=e964]: LatePenalty - late registration chip penalty
    - listitem [ref=e965]: MinPlayers - number from 2 to 1000
    - listitem [ref=e966]: RecurMinutes - number from 0 to 999999
    - listitem [ref=e967]: ResetSeconds - number from 10 to 999999
    - listitem [ref=e968]: MaxRuns - number from 0 to 999999
    - listitem [ref=e969]: NoShowMinutes - number from 0 to 999999
    - listitem [ref=e970]: PrimaryCurrency - Yes for primary currency, No for secondary currency
    - listitem [ref=e971]: BuyIn - number of chips
    - listitem [ref=e972]: Bounty - number of chips
    - listitem [ref=e973]: PKOBounty - "Yes" or "No"
    - listitem [ref=e974]: EntryFee - number of chips
    - listitem [ref=e975]: Ticket - ticket token
    - listitem [ref=e976]: TicketRequired - "Yes" or "No"
    - listitem [ref=e977]: TicketFunded - "Yes" or "No"
    - listitem [ref=e978]: PrizeBonus - number of chips
    - listitem [ref=e979]: MultiplyBonus - set to "Yes", "No", or "Min"
    - listitem [ref=e980]: Chips - number of starting chips, from 10 to 25000
    - listitem [ref=e981]: BonusTicket - bonus ticket prefix
    - listitem [ref=e982]: AddOnChips - number of add-on chips, from 0 to 50000
    - listitem [ref=e983]: TurnClock - number of seconds, from 10 to 120
    - listitem [ref=e984]: TurnWarning - number of seconds, from 5 to 119
    - listitem [ref=e985]: TimeBank - number of seconds, from 0 to 600
    - listitem [ref=e986]: BankSync - "Yes" or "No"
    - listitem [ref=e987]: BankReset - number of hands, from 0 to 999999
    - listitem [ref=e988]: DisconBank - 0 to 180 seconds
    - listitem [ref=e989]: Level - level minutes, from 1 to 1000
    - listitem [ref=e990]: RebuyLevels - number of levels in rebuy period, 0 to 1000
    - listitem [ref=e991]: Threshold - max chips allowed before rebuy, 0 to 999999
    - listitem [ref=e992]: MaxRebuys - maximum rebuys allowed (-1 = unlimited)
    - listitem [ref=e993]: RebuyCost - number of chips
    - listitem [ref=e994]: RebuyFee - number of chips
    - listitem [ref=e995]: MaxReentries - max re-entries allowed per player (0 to 100)
    - listitem [ref=e996]: CanResign - "Yes" or "No"
    - listitem [ref=e997]: BreakTime - number of minutes per rest break, 0 to 60
    - listitem [ref=e998]: BreakInterval - 1 to 1000 (or 0 to 59 if BreakSync = Yes)
    - listitem [ref=e999]: BreakSync - Yes (minutes past hour) or No (levels between breaks)
    - listitem [ref=e1000]: AutoChop - "No", "Equal", or "50/50"
    - listitem [ref=e1001]: PlayerChop - "Yes" or "No" (v7.00 to v7.12)
    - listitem [ref=e1002]: PlayerChopMax - 0 or 2 to 10 (v7.13+)
    - listitem [ref=e1003]: BringInPercent - number 1 to 99
    - listitem [ref=e1004]: Blinds - blind schedule in the format of "SB1/BB1/Ante1, SB2/BB2/Ante2", etc. Leave blank for the default schedule
    - listitem [ref=e1005]: Payout - payout structure in the format of "2-4, 100.00|5-7, 65.00, 35.00|8-10, 50.00, 30.00, 20.00". Leave blank for the default structure
    - listitem [ref=e1006]: PayoutFractions - Yes (default) or No
    - listitem [ref=e1007]: PayoutTickets - optional comma-separated list of ticket tokens
    - listitem [ref=e1008]: UnregLogout - "Yes" or "No", indicates if player should be unregistered if they log out
    - listitem [ref=e1009]: TableGraphic - path to local image file
    - listitem [ref=e1010]: TableGraphicFinal - path to local image file
    - listitem [ref=e1011]: "TableColorOn - #rrggbb format or leave blank for default"
    - listitem [ref=e1012]: "TableColorOff - #rrggbb format or leave blank for default"
    - listitem [ref=e1013]: Note - up to 500 characters
  - paragraph [ref=e1014]: TournamentsDelete - deletes the tournament specified by the Name parameter (required). The game must already be in an offline state before it can be deleted.
  - paragraph [ref=e1015]: TournamentsEdit - edits one or more properties of an offline tournament specified by the Name parameter (required). Fields not specified will retain their current value.
  - list [ref=e1016]:
    - listitem [ref=e1017]: NewName - use this parameter to change the name of the tournament
    - listitem [ref=e1018]: Creator - name of admin that create game
    - listitem [ref=e1019]: Description - optional tournament description, up to 500 characters
    - listitem [ref=e1020]: Auto - set to "Yes" or "No" to put game online when server is started
    - listitem [ref=e1021]: Game - specify "Limit Hold'em", "Pot Limit Hold'em", "No Limit Hold'em", "Pot Limit 6+Hold'em", "No Limit 6+Hold'em", "Limit Omaha", "Pot Limit Omaha", "No Limit Omaha", "Limit Omaha Hi-Lo", "Pot Limit Omaha Hi-Lo", "No Limit Omaha Hi-Lo", "Limit Omaha-5", "Pot Limit Omaha-5", "No Limit Omaha-5", "Limit Omaha-5 Hi-Lo", "Pot Limit Omaha-5 Hi-Lo", "No Limit Omaha-5 Hi-Lo", "Limit Omaha-6", "Pot Limit Omaha-6", "No Limit Omaha-6", "Limit Omaha-6 Hi-Lo", "Pot Limit Omaha-6 Hi-Lo", "No Limit Omaha-6 Hi-Lo", "Limit Courchevel", "Pot Limit Courchevel", "No Limit Courchevel", "Limit Courchevel Hi-Lo", "Pot Limit Courchevel Hi-Lo", "No Limit Courchevel Hi-Lo", "Limit Razz", "Limit Stud", "Limit Stud Hi-Lo", "Mixed"
    - listitem [ref=e1022]: MixedList - if Game is set to "Mixed" then this field must contain a comma-separated list of two or more game types
    - listitem [ref=e1023]: Shootout - set to "Yes" for a shootout format or "No" for a standard format
    - listitem [ref=e1024]: PW - (optional) specify a password needed to register
    - listitem [ref=e1025]: Private - set to "Yes" to prevent observing without the password or "No" to allow observers
    - listitem [ref=e1026]: PermRegister - register permission token, 15 alphanumeric characters max
    - listitem [ref=e1027]: PermUnregister - unregister permission token, 15 alphanumeric characters max
    - listitem [ref=e1028]: PermObserve - observe permission token, 15 alphanumeric characters max
    - listitem [ref=e1029]: PermPlayerChat - player chat permission token, 15 alphanumeric characters max
    - listitem [ref=e1030]: PermObserverChat - observer chat permission token, 15 alphanumeric characters max
    - listitem [ref=e1031]: SuspendChatAllIn - either "Yes" or "No"
    - listitem [ref=e1032]: Seats - number of seats per table, from 2 to 10
    - listitem [ref=e1033]: MaxEntrants - multiple of seat count, 2 to 1000
    - listitem [ref=e1034]: StartFull - either "Yes" or "No"
    - listitem [ref=e1035]: StartOnDemand - either "Yes" or "No"
    - listitem [ref=e1036]: StartMin - number from 0 to 10
    - listitem [ref=e1037]: StartCode - number from 0 (disabled) to 999999
    - listitem [ref=e1038]: StartTime - yyyy-mm-dd hh:mm format (0000-00-00 00:00 = disabled)
    - listitem [ref=e1039]: RegMinutes - number of minutes, 0 to 999999
    - listitem [ref=e1040]: LateRegMinutes - number of minutes, 0 to 999999
    - listitem [ref=e1041]: LatePenalty - late registration chip penalty
    - listitem [ref=e1042]: MinPlayers - number from 2 to 1000
    - listitem [ref=e1043]: RecurMinutes - number from 0 to 999999
    - listitem [ref=e1044]: ResetSeconds - number from 10 to 999999
    - listitem [ref=e1045]: MaxRuns - number from 0 to 999999
    - listitem [ref=e1046]: NoShowMinutes - number from 0 to 999999
    - listitem [ref=e1047]: PrimaryCurrency - Yes for primary currency, No for secondary currency
    - listitem [ref=e1048]: BuyIn - number of chips
    - listitem [ref=e1049]: Bounty - number of chips
    - listitem [ref=e1050]: PKOBounty - "Yes" or "No"
    - listitem [ref=e1051]: EntryFee - number of chips
    - listitem [ref=e1052]: Ticket - ticket token
    - listitem [ref=e1053]: TicketRequired - "Yes" or "No"
    - listitem [ref=e1054]: TicketFunded - "Yes" or "No"
    - listitem [ref=e1055]: PrizeBonus - number of chips
    - listitem [ref=e1056]: MultiplyBonus - set to "Yes", "No", or "Min"
    - listitem [ref=e1057]: Chips - number of starting chips, from 10 to 25000
    - listitem [ref=e1058]: BonusTicket - bonus ticket prefix
    - listitem [ref=e1059]: AddOnChips - number of add-on chips, from 0 to 50000
    - listitem [ref=e1060]: TurnClock - number of seconds, from 10 to 120
    - listitem [ref=e1061]: TurnWarning - number of seconds, from 5 to 119
    - listitem [ref=e1062]: TimeBank - number of seconds, from 0 to 600
    - listitem [ref=e1063]: BankSync - "Yes" or "No"
    - listitem [ref=e1064]: BankReset - number of hands, from 0 to 999999
    - listitem [ref=e1065]: DisconBank - 0 to 180 seconds
    - listitem [ref=e1066]: Level - level minutes, from 1 to 1000
    - listitem [ref=e1067]: RebuyLevels - number of levels in rebuy period, 0 to 1000
    - listitem [ref=e1068]: Threshold - max chips allowed before rebuy, 0 to 999999
    - listitem [ref=e1069]: MaxRebuys - maximum rebuys allowed (-1 = unlimited)
    - listitem [ref=e1070]: RebuyCost - number of chips
    - listitem [ref=e1071]: RebuyFee - number of chips
    - listitem [ref=e1072]: MaxReentries - max re-entries allowed per player (0 to 100)
    - listitem [ref=e1073]: CanResign - "Yes" or "No"
    - listitem [ref=e1074]: BreakTime - number of minutes per rest break, 0 to 60
    - listitem [ref=e1075]: BreakInterval - 1 to 1000 (or 0 to 59 if BreakSync = Yes)
    - listitem [ref=e1076]: BreakSync - Yes (minutes past hour) or No (levels between breaks)
    - listitem [ref=e1077]: AutoChop - "No", "Equal", or "50/50"
    - listitem [ref=e1078]: PlayerChop - "Yes" or "No" (v7.00 to v7.12)
    - listitem [ref=e1079]: PlayerChopMax - 0 or 2 to 10 (v7.13+)
    - listitem [ref=e1080]: BringInPercent - number 1 to 99
    - listitem [ref=e1081]: Blinds - blind schedule in the format of "SB1/BB1/Ante1, SB2/BB2/Ante2", etc. Leave blank for the default schedule
    - listitem [ref=e1082]: Payout - payout structure in the format of "2-4, 100.00|5-7, 65.00, 35.00|8-10, 50.00, 30.00, 20.00". Leave blank for the default structure
    - listitem [ref=e1083]: PayoutFractions - Yes (default) or No
    - listitem [ref=e1084]: PayoutTickets - optional comma-separated list of ticket tokens
    - listitem [ref=e1085]: UnregLogout - "Yes" or "No", indicates if player should be unregistered if they log out
    - listitem [ref=e1086]: TableGraphic - path to local image file
    - listitem [ref=e1087]: TableGraphicFinal - path to local image file
    - listitem [ref=e1088]: "TableColorOn - #rrggbb format or leave blank for default"
    - listitem [ref=e1089]: "TableColorOff - #rrggbb format or leave blank for default"
    - listitem [ref=e1090]: Note - up to 500 characters
  - paragraph [ref=e1091]: "TournamentsGet - retrieve the settings for the tournament specified by the Name parameter (required). A sample response will look something like this (JSON format):"
  - generic [ref=e1092]: "{\"Result\":\"Ok\", \"Name\":\"Tournament #1\", \"Status\":\"Playing: 6 of 9\", \"Creator\":\"Administrator\", \"Description\":\"\", \"Auto\":\"Yes\", \"Game\":\"No Limit Hold'em\", \"MixedList\":\"\", \"Shootout\":\"No\", \"PW\":\"\", \"Private\":\"No\", \"PermRegister\":\"\", \"PermUnregister\":\"\", \"PermObserve\":\"\", \"PermPlayerChat\":\"\", \"PermObserverChat\":\"\", \"SuspendChatAllIn\":\"No\", \"Seats\":9, \"MaxEntrants\":99, \"StartFull\":\"Yes\", \"StartOnDemand\":\"No\", \"StartMin\":1, \"StartCode\":0, \"StartTime\":\"0000-00-00 00:00\", \"RegMinutes\":0, \"LateRegMinutes\":0, \"LatePenalty\":0, \"MinPlayers\":2, \"RecurMinutes\":0, \"ResetSeconds\":30, \"MaxRuns\":0, \"NoShowMinutes\":0, \"PrimaryCurrency\":\"Yes\", \"BuyIn\":1500, \"Bounty\":0, \"PKOBounty\":\"No\", \"EntryFee\":0, \"Ticket\":\"\", \"TicketRequired\":\"No\", \"TicketFunded\":\"No\", \"PrizeBonus\":0, \"MultiplyBonus\":\"No\", \"Chips\":1500, \"BonusTicket\":\"\", \"AddOnChips\":0, \"TurnClock\":30, \"TurnWarning\":10, \"TimeBank\":60, \"BankSync\":\"Yes\", \"BankReset\":0, \"DisconBank\":60, \"Level\":10, \"RebuyLevels\":0, \"Threshold\":1500, \"MaxRebuys\":0, \"RebuyCost\":0, \"RebuyFee\":0, \"MaxReentries\":0, \"CanResign\":\"No\", \"BreakTime\":0, \"BreakInterval\":60, \"BreakSync\":\"No\", \"AutoChop\":\"No\", \"PlayerChopMax\":0, \"BringInPercent\":30, \"Blinds\":\"10/20/0, 15/30/0, 25/50/0, 50/100/0, 75/150/0, 100/200/0, 100/200/25, 200/400/25, 300/600/50, 400/800/50, 600/1200/75, 800/1600/75, 1000/2000/100, 1500/3000/150, 2000/4000/200, 3000/6000/300, 4000/8000/400\", \"Payout\":\"2-4, 100.00|5-7, 65.00, 35.00|8-10, 50.00, 30.00, 20.00\", \"PayoutFractions\":\"Yes\", \"PayoutTickets\":\"\", \"UnregLogout\":\"No\", \"TableGraphic\":\"\", \"TableGraphicFinal\":\"\", \"TableColorOn\":\"\", \"TableColorOff\":\"\", \"Note\":\"\"}"
  - paragraph [ref=e1093]: "or in legacy format:"
  - generic [ref=e1094]: "Result=Ok Name=Tournament #1 Status=Playing: 6 of 9 Creator=Administrator Description= Auto=Yes Game=No Limit Hold'em MixedList= Shootout=No PW= Private=No PermRegister= PermUnregister= PermObserve= PermPlayerChat= PermObserverChat= SuspendChatAllIn=No Seats=9 MaxEntrants=99 StartFull=Yes StartOnDemand=No StartMin=1 StartCode=0 StartTime=0000-00-00 00:00 RegMinutes=0 LateRegMinutes=0 LatePenalty=0 MinPlayers=2 RecurMinutes=0 ResetSeconds=30 MaxRuns=0 NoShowMinutes=0 PrimaryCurrency=Yes BuyIn=1500 Bounty=0 PKOBounty=No EntryFee=0 Ticket= TicketRequired=No TicketFunded=No PrizeBonus=0 MultiplyBonus=No Chips=1500 BonusTicket= AddOnChips=0 TurnClock=30 TurnWarning=10 TimeBank=60 BankSync=Yes BankReset=0 DisconBank=60 Level=10 RebuyLevels=0 Threshold=1500 MaxRebuys=0 RebuyCost=0 RebuyFee=0 MaxReentries=0 CanResign=No BreakTime=0 BreakInterval=60 BreakSync=No AutoChop=No PlayerChopMax=0 BringInPercent=30 Blinds=10/20/0, 15/30/0, 25/50/0, 50/100/0, 75/150/0, 100/200/0, 100/200/25, 200/400/25, 300/600/50, 400/800/50, 600/1200/75, 800/1600/75, 1000/2000/100, 1500/3000/150, 2000/4000/200, 3000/6000/300, 4000/8000/400 Payout=2-4, 100.00|5-7, 65.00, 35.00|8-10, 50.00, 30.00, 20.00 PayoutFractions=Yes PayoutTickets= UnregLogout=No TableGraphic= TableGraphicFinal= TableColorOn= TableColorOff= Note="
  - paragraph [ref=e1095]: "TournamentsList - retrieves the list of all tournaments. Calling this with no parameters will just return the number of tournaments. Set the Fields parameter to a comma separated list of field names that you want returned. Do not include spaces in the list. You may choose any combination of these fields:"
  - paragraph [ref=e1096]: Name, Status, Creator, Description, Auto, Game, MixedList, Shootout, PW, Private, PermRegister, PermUnregister, PermObserve, PermPlayerChat, PermObserverChat, SuspendChatAllIn, Seats, MaxEntrants, StartFull, StartOnDemand, StartMin, StartCode, StartTime, RegMinutes, LateRegMinutes, LatePenalty, MinPlayers, RecurMinutes, ResetSeconds, MaxRuns, NoShowMinutes, PrimaryCurrency, BuyIn, Bounty, PKOBounty, EntryFee, Ticket, TicketRequired, TicketFunded, PrizeBonus, MultiplyBonus, Chips, BonusTicket, AddOnChips, TurnClock, TurnWarning, TimeBank, BankSync, BankReset, DisconBank, Level, RebuyLevels, Threshold, MaxRebuys, RebuyCost, RebuyFee, MaxReentries, CanResign, BreakTime, BreakInterval, BreakSync, AutoChop, PlayerChopMax, BringInPercent, Blinds, Payout, PayoutFractions, PayoutTickets, UnregLogout, TableGraphic, TableGraphicFinal, TableColorOn, TableColorOff, Note
  - paragraph [ref=e1097]: "A sample response with \"Fields=Name,Game\" may look something like this (JSON format):"
  - generic [ref=e1098]: "{\"Result\":\"Ok\",\"Tournaments\":3,\"Name\":[\"Tournament #1\",\"Tournament #2\",\"Tournament #3\"],\"Game\":[\"Limit Hold'em\",\"Pot Limit Hold'em\",\"No Limit Hold'em\"]}"
  - paragraph [ref=e1099]: "or in legacy format:"
  - generic [ref=e1100]: "Result=Ok Tournaments=3 Name1=Tournament #1 Game1=Limit Hold'em Name2=Tournament #2 Game2=Pot Limit Hold'em Name3=Tournament #3 Game3=No Limit Hold'em"
  - paragraph [ref=e1101]: TournamentsMessage - sends an Administrator message to the chat box for all tables in the tournament specified by the Name parameter (required). Put the text of the message in the Message parameter (required). Use an asterisk (*) as the Name parameter to send the message to all tournaments.
  - paragraph [ref=e1102]: TournamentsOffline - closes the tournament specified by the Name parameter (required) and puts it in an offline state. Set an optional Now parameter to "Yes" to close the tournament immediately. Otherwise, the tournament will close after it finishes.
  - paragraph [ref=e1103]: TournamentsOnline - puts the tournament specified by the Name parameter (required) into an online state, making it available for play.
  - paragraph [ref=e1104]: TournamentsOpen - opens a tournament table in the player client for the specified player (who must already be logged in). Specify the tournament by the Name parameter (required), the table number by the Table parameter (optional, defaults to 1), and the player by the Player parameter (required).
  - paragraph [ref=e1105]: TournamentsPause - pauses a running tournament specified by the Name parameter (required). Set parameter Now to "Yes" (the default) to pause all tables immediately or to "No" to pause each table individually once the current hand completes.
  - paragraph [ref=e1106]: "TournamentsPlaying - retrieves the list of seated and finished players for the tournament specified by the Name parameter (required). The tournament number and running time are also included. The Away field shows the number of minutes that a player has been sitting out. A sample response may look something like this (JSON format):"
  - generic [ref=e1107]: "{\"Result\":\"Ok\",\"Number\":123456,\"Time\":\"0:32\",\"Count\":3,\"Player\":[\"Aces123\",\"BoneCrusher\",\"Dave\"],\"Table\":[1,1,0],\"Seat\":[1,4,0],\"Chips\":[\"1650\",\"1475\",\"Finished\"],\"Rebuys\":[0,0,0],\"AddOns\":[0,0,0],\"Rank\":[1,2,3],\"NoShow\":[\"No\",\"No\",\"No\"],\"Away\":[0,0,1]}"
  - paragraph [ref=e1108]: "or in legacy format:"
  - generic [ref=e1109]: Result=Ok Number=123456 Time=0:32 Player1=Aces123 Table1=1 Seat1=1 Chips1=1650 Rebuys1=0 AddOns1=0 Rank1=1 NoShow1=No Away1=0 Player2=BoneCrusher Table2=1 Seat2=4 Chips2=1475 Rebuys2=0 AddOns2=0 Rank2=2 NoShow2=No Away2=0 Player3=Dave Table3=0 Seat3=0 Chips3=Finished Rebuys3=0 AddOns3=0 Rank3=3 NoShow3=No Away3=1 Count=3
  - paragraph [ref=e1110]: TournamentsRegister - registers a player specified by the Player parameter (required) for the tournament specified by the Name parameter (required) and automatically deducts the applicable buy-in from their account. The player does not have to be logged in. Use the optional Negative parameter to bypass the system "Allow negative balance" setting. Set to "Allow" to allow the player's balance to go to a negative balance if they do not have enough chips to meet the buy-in price or to "Skip" to deny the registration in that case. Leave this parameter blank to obey the system setting.
  - paragraph [ref=e1111]: TournamentsRemoveNoShows - removes all "no-show" players (never clicked their Ready button) from a running tournament specified by the Name parameter (required). Their buyin/entry fees are removed from the prizepool and added back to their accounts. No-shows can be removed up to the point of payout distribution.
  - paragraph [ref=e1112]: "TournamentsResults - call without any parameters to retrieve a list of dates and tournament names where a tournament results file was created. Example output will look something like this (JSON format):"
  - generic [ref=e1113]: "{\"Result\":\"Ok\",\"Files\":2,\"Date\":[\"2015-03-01\",\"2015-03-05\"],\"Name\":[\"Tournament #2\",\"Tournament #5\"]}"
  - paragraph [ref=e1114]: "or in legacy format:"
  - generic [ref=e1115]: "Result=Ok Files=2 Date1=2015-03-01 Name1=Tournament #2 Date2=2015-03-05 Name2=Tournament #5"
  - paragraph [ref=e1116]: "Call with a Date parameter in the format of yyyy-mm-dd and a Name parameter to retrieve the contents of a tournament results file. Beginning with version 5.18, use the optional Start and Count parameters to specify a range of lines to retrieve. The first line number is 0. A Start value of -1 will retrieve lines from the end of the file. A Count value of 0 will retrieve the remaining lines from the starting point. Example output will look something like this (JSON format):"
  - generic [ref=e1117]: "{\"Results\":\"Ok\",\"Start\":0,\"Count\":36,\"Data\":[\"Tournament=Tournament #1\",\"Number=39\",\"BuyIn=1500+0\",\"PrizeBonus=0\",\"MultiplyBonus=No\",\"Entrants=2\",\"Late=0\",\"Removed=0\",\"Rebuys=0\",\"AddOns=0\",\"RebuyCost=0+0\",\"NetBonus=0\",\"StopOnChop=No\",\"Start=2015-07-12 13:41:21\",\"Place2=BoneCrusher (0)\",\"Place1=Aces123 (3000)\",\"Stop=2015-07-12 13:42:04\",\"\",\"Tournament=Tournament #1\",\"Number=40\",\"BuyIn=1500+0\",\"PrizeBonus=0\",\"MultiplyBonus=No\",\"Entrants=3\",\"Late=0\",\"Removed=0\",\"Rebuys=1\",\"AddOns=1\",\"RebuyCost=1500+0\",\"NetBonus=0\",\"StopOnChop=No\",\"Start=2015-07-12 7:11:26\",\"Place3=DeathBot (0) Rebuys:1 AddOn:Yes\",\"Place2=Aces123 (0) Rebuys:0 AddOn:No\",\"Place1=BoneCrusher (7500) Rebuys:0 AddOn:No\",\"Stop=2015-07-12 17:12:08\"]}"
  - paragraph [ref=e1118]: "or in legacy format:"
  - generic [ref=e1119]: "Results=Ok Start=0 Count=36 Tournament=Tournament #1 Number=39 BuyIn=1500+0 PrizeBonus=0 MultiplyBonus=No Entrants=2 Late=0 Removed=0 Rebuys=0 AddOns=0 RebuyCost=0+0 NetBonus=0 StopOnChop=No Start=2015-07-12 13:41:21 Place2=BoneCrusher (0) Place1=Aces123 (3000) Stop=2015-07-12 13:42:04 Tournament=Tournament #1 Number=40 BuyIn=1500+0 PrizeBonus=0 MultiplyBonus=No Entrants=3 Late=0 Removed=0 Rebuys=1 AddOns=1 RebuyCost=1500+0 NetBonus=0 StopOnChop=No Start=2015-07-12 17:11:26 Place3=DeathBot (0) Rebuys:1 AddOn:Yes Place2=Aces123 (0) Rebuys:0 AddOn:No Place1=BoneCrusher (7500) Rebuys:0 AddOn:No Stop=2015-07-12 17:12:08"
  - paragraph [ref=e1120]: Beginning with version 7.09, call with a Number parameter (indicating the tournament number) to retrieve the results of a single tournament. Leave the other parameters blank when using the Number parameter. The server caches the results of the last 100 tournaments played so the specified number must still be in the cache or an error will be returned. Use the Tournament Finish callback event to get notified when a new result (and its number) is available.
  - paragraph [ref=e1121]: TournamentsResume - resumes a paused tournament specified by the Name parameter (required).
  - paragraph [ref=e1122]: TournamentsStart - manually starts the tournament specified by the Name parameter (required). There must be at least two players registered to start a tournament.
  - paragraph [ref=e1123]: "TournamentsStats - retrieves basic statistics on a running tournament specified by the Name parameter (required). The tournament number and running time are also included. The Time parameter will be blank if the tournament is not currently running. A sample response may look something like this (JSON format):"
  - generic [ref=e1124]: "{\"Result\":\"Ok\",\"Number\":1234,\"Time\":\"0:01\",\"LevelNumber\":1,\"LevelSeconds\": 600,\"Entrants\":9,\"LateRegs\":0,\"Playing\":9,\"Removed\":0,\"Rebuys\":0,\"AddOns\":0,\"Smallest\":1400,\"Average\":1500,\"Largest\":1600,\"Prizepool\":13500,\"Payouts\":3,\"Payout\":[6750,4050,2700]}"
  - paragraph [ref=e1125]: "or in legacy format:"
  - generic [ref=e1126]: Result=Ok Number=1234 Time=0:01 LevelNumber=1 LevelSeconds=600 Entrants=9 LateRegs=0 Playing=9 Removed=0 Rebuys=0 AddOns=0 Smallest=1400 Average=1500 Largest=1600 Prizepool=13500 Payouts=3 Payout1=6750 Payout2=4050 Payout3=2700
  - paragraph [ref=e1127]: TournamentsUnregister - removes a player specified by the Player parameter (required) from the waiting list of a tournament specified by the Name parameter (required) and refunds their account with the applicable buy-in.
  - paragraph [ref=e1128]: "TournamentsWaiting - retrieves the list of registered players in the waiting list for the tournament specified by the Name parameter (required). A sample response will look something like this (JSON format):"
  - generic [ref=e1129]: "{\"Result\":\"Ok\",\"Count\":3,\"Wait\":[\"Aces123\",\"BoneCrusher\",\"Wizard\"]}"
  - paragraph [ref=e1130]: "or in legacy format:"
