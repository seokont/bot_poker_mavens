  - heading "♣ Ring Game Commands" [level=4] [ref=e478]
  - paragraph [ref=e479]: "RingGamesAdd - adds a new ring game to the system. The newly created game will be in an offline state. Name is the only required parameter. Other parameters not specified will receive default values:"
  - list [ref=e480]:
    - listitem [ref=e481]: Name - a unique name, from 1 to 40 characters
    - listitem [ref=e482]: Creator - Name of admin that created game
    - listitem [ref=e483]: Description - optional table description, up to 500 characters
    - listitem [ref=e484]: Auto - set to "Yes" or "No" to put game online when server is started
    - listitem [ref=e485]: Game - specify "Limit Hold'em", "Pot Limit Hold'em", "No Limit Hold'em", "Cap Limit Hold'em", "Pot Limit 6+Hold'em", "No Limit 6+Hold'em", "Cap Limit 6+Hold'em", "Limit Omaha", "Pot Limit Omaha", "No Limit Omaha", "Cap Limit Omaha", "Limit Omaha Hi-Lo", "Pot Limit Omaha Hi-Lo", "No Limit Omaha Hi-Lo", "Cap Limit Omaha Hi-Lo", "Limit Omaha-5", "Pot Limit Omaha-5", "No Limit Omaha-5", "Cap Limit Omaha-5", "Limit Omaha-5 Hi-Lo", "Pot Limit Omaha-5 Hi-Lo", "No Limit Omaha-5 Hi-Lo", "Cap Limit Omaha-5 Hi-Lo", "Limit Omaha-6", "Pot Limit Omaha-6", "No Limit Omaha-6", "Cap Limit Omaha-6", "Limit Omaha-6 Hi-Lo", "Pot Limit Omaha-6 Hi-Lo", "No Limit Omaha-6 Hi-Lo", "Cap Limit Omaha-6 Hi-Lo", "Limit Courchevel", "Pot Limit Courchevel", "No Limit Courchevel", "Cap Limit Courchevel", "Limit Courchevel Hi-Lo", "Pot Limit Courchevel Hi-Lo", "No Limit Courchevel Hi-Lo", "Cap Limit Courchevel Hi-Lo", "Limit Razz", "Limit Stud", "Limit Stud Hi-Lo", "Mixed", "Mixed Choice"
    - listitem [ref=e486]: MixedList - if Game is set to "Mixed" then this field must contain a comma-separated list of two or more game types
    - listitem [ref=e487]: MixedHands - number of hands in mixed rounds, 0 to 1000
    - listitem [ref=e488]: PW - (optional) specify a password needed to take a seat
    - listitem [ref=e489]: Private - set to "Yes" to prevent observing without the password or "No" to allow observers
    - listitem [ref=e490]: PermPlay - play permission token, 15 alphanumeric characters max
    - listitem [ref=e491]: PermObserve - observe permission token, 15 alphanumeric characters max
    - listitem [ref=e492]: PermPlayerChat - player chat permission token, 15 alphanumeric characters max
    - listitem [ref=e493]: PermObserverChat - observer chat permission token, 15 alphanumeric characters max
    - listitem [ref=e494]: SuspendChatAllIn - either "Yes" or "No"
    - listitem [ref=e495]: Seats - number of seats, from 2 to 10
    - listitem [ref=e496]: StartMin - 2 to 10
    - listitem [ref=e497]: StartCode 0 to 999999
    - listitem [ref=e498]: PrimaryCurrency - Yes for primary currency or No for secondary currency
    - listitem [ref=e499]: SmallestChip - 0.01, 0.05, 0.25, 1, 5, 25, 100, 500, 1000, 5000, 25000, 100000, 500000, 1000000, 5000000, 25000000, 100000000, 500000000, 1000000000
    - listitem [ref=e500]: BuyInMin - number of chips
    - listitem [ref=e501]: BuyInMax - number of chips
    - listitem [ref=e502]: BuyInDef - number of chips
    - listitem [ref=e503]: CapLimit - number of chips for CL games
    - listitem [ref=e504]: RakePercent - percent number (Pro/Gold feature)
    - listitem [ref=e505]: RakeCap - number of chips, or 0 for no cap (Pro/Gold feature)
    - listitem [ref=e506]: TurnClock - number of seconds, from 10 to 120
    - listitem [ref=e507]: TurnWarning - number of seconds, from 5 to 119
    - listitem [ref=e508]: TimeBank - number of seconds, from 0 to 600
    - listitem [ref=e509]: BankSync - "Yes" or "No"
    - listitem [ref=e510]: BankReset - number of hands, from 0 to 999999
    - listitem [ref=e511]: DisconBank - 0 to 180 seconds
    - listitem [ref=e512]: SmallBlind - number of chips
    - listitem [ref=e513]: BigBlind - number of chips
    - listitem [ref=e514]: AllowStraddle - "Yes" or "No"
    - listitem [ref=e515]: SmallBet - number of chips
    - listitem [ref=e516]: BigBet - number of chips
    - listitem [ref=e517]: Ante - number of chips
    - listitem [ref=e518]: AnteAll - "Yes" or "No"
    - listitem [ref=e519]: BringIn - number of chips
    - listitem [ref=e520]: DupeIPs - set to "Yes" or "No" to allow or disallow players with the same IP address at the table
    - listitem [ref=e521]: RatholeMinutes - number of minutes, from 0 to 120
    - listitem [ref=e522]: RunItTwice - "Yes" or "No"
    - listitem [ref=e523]: SitoutMinutes - number of minutes, from 1 to 120
    - listitem [ref=e524]: SitoutRelaxed - set to "Yes" or "No"
    - listitem [ref=e525]: TableGraphic - set to full path for the table graphic. Leave blank for default site table graphic.
    - listitem [ref=e526]: "TableColorOn - #rrggbb format, leave blank for default."
    - listitem [ref=e527]: "TableColorOff - #rrggbb format, leave blank for default."
    - listitem [ref=e528]: Note - private note, up to 500 characters
  - paragraph [ref=e529]: RingGamesDelete - deletes the ring game specified by the Name parameter (required). The game must already be in an offline state before it can be deleted.
  - paragraph [ref=e530]: RingGamesEdit - edits one or more properties of an offline ring game specified by the Name parameter (required). Fields not specified will retain their current value.
  - list [ref=e531]:
    - listitem [ref=e532]: NewName - use this parameter to change the name of the ring game
