  - paragraph [ref=e580]: RingGamesEject - eject a player specified by the Player parameter (required) from the ring game (or waiting list) specified by the Name parameter (required).
  - paragraph [ref=e581]: "RingGamesGet - retrieve the settings for the ring game specified by the Name parameter (required). A sample response will look something like this (JSON format):"
  - generic [ref=e582]: "{\"Result\":\"Ok\", \"Name\":\"Ring Game #1\", \"Status\":\"Playing: 9\", \"Creator\":\"Administrator\", \"Description\":\"\", \"Auto\":\"Yes\", \"Game\":\"No Limit Hold'em\", \"MixedList\":\"\", \"MixedHands\":0, \"PW\":\"\", \"Private\":\"No\", \"PermPlay\":\"\", \"PermObserve\":\"\", \"PermPlayerChat\":\"\", \"PermObserverChat\":\"\", \"SuspendChatAllIn\":\"No\", \"Seats\":9, \"StartMin\":2, \"StartCode\":0, \"PrimaryCurrency\":\"Yes\", \"SmallestChip\":1, \"BuyInMin\":500, \"BuyInMax\":2500, \"BuyInDef\":1500, \"CapLimit\":0, \"RakePercent\":0, \"RakeCap\":0, \"TurnClock\":30, \"TurnWarning\":10, \"TimeBank\":60, \"BankSync\":\"Yes\", \"BankReset\":0, \"DisconBank\":60, \"SmallBlind\":10, \"BigBlind\":20, \"AllowStraddle\":\"No\", \"SmallBet\":0, \"BigBet\":0, \"Ante\":0, \"AnteAll\":\"No\", \"BringIn\":0, \"DupeIPs\":\"No\", \"RatholeMinutes\":0, \"RunItTwice\":\"No\", \"SitoutMinutes\":10, \"SitoutRelaxed\":\"No\", \"TableGraphic\":\"\", \"TableColorOn\":\"\", \"TableColorOff\":\"\", \"Note\":\"\"}"
  - paragraph [ref=e583]: "or in legacy format:"
  - generic [ref=e584]: "Result=Ok Name=Ring Game #1 Status=Playing: 9 Creator=Administrator Description= Auto=Yes Game=No Limit Hold'em MixedList= MixedHands=0 PW= Private=No PermPlay= PermObserve= PermPlayerChat= PermObserverChat= SuspendChatAllIn=No Seats=9 StartMin=2 StartCode=0 PrimaryCurrency=Yes SmallestChip=1 BuyInMin=500 BuyInMax=2500 BuyInDef=1500 CapLimit=0 RakePercent=0 RakeCap=0 TurnClock=30 TurnWarning=10 TimeBank=60 BankSync=Yes BankReset=0 DisconBank=60 SmallBlind=10 BigBlind=20 AllowStraddle=No SmallBet=0 BigBet=0 Ante=0 AnteAll=No BringIn=0 DupeIPs=No RatholeMinutes=0 RunItTwice=No SitoutMinutes=10 SitoutRelaxed=No TableGraphic= TableColorOn= TableColorOff= Note="
  - paragraph [ref=e585]: "RingGamesList - retrieves the list of all ring games. Calling this with no parameters will just return the number of ring games. Set the Fields parameter to a comma separated list of field names that you want returned. Do not include spaces in the list. You may choose any combination of these fields:"
  - paragraph [ref=e586]: Name, Status, Creator, Description, Auto, Game, MixedList, MixedHands, PW, Private, PermPlay, PermObserve, PermPlayerChat, PermObserverChat, SuspendChatAllIn, Seats, StartMin, StartCode, PrimaryCurrency, SmallestChip, BuyInMin, BuyInMax, BuyInDef, CapLimit, RakePercent, RakeCap, TurnClock, TurnWarning, TimeBank, BankSync, BankReset, DisconBank, SmallBlind, BigBlind, AllowStraddle, SmallBet, BigBet, Ante, AnteAll, BringIn, DupeIPs, RatholeMinutes, RunItTwice, SitoutMinutes, SitoutRelaxed, TableGraphic, TableColorOn, TableColorOff, Note
  - paragraph [ref=e587]: "A sample response with \"Fields=Name,Game\" may look something like this (JSON format):"
  - generic [ref=e588]: "{\"Result\":\"Ok\",\"RingGames\":3,\"Name\":[\"Ring Game #1\",\"Ring Game #2\",\"Ring Game #3\"],\"Game\":[\"No Limit Hold'em\",\"Pot Limit Hold'em\",\"Limit Hold'em\"]}"
  - paragraph [ref=e589]: "or in legacy format:"
  - generic [ref=e590]: "Result=Ok RingGames=3 Name1=Ring Game #1 Game1=No Limit Hold'em Name2=Ring Game #2 Game2=Pot Limit Hold'em Name3=Ring Game #3 Game3=Limit Hold'em"
  - paragraph [ref=e591]: RingGamesMessage - sends an Administrator message to the chat box for the ring game specified by the Name parameter (required). Put the text of the message in the Message parameter (required). Use an asterisk (*) as the Name parameter to send the message to all ring game tables.
  - paragraph [ref=e592]: RingGamesOffline - closes the ring game specified by the Name parameter (required) and puts it in an offline state. Set an optional Now parameter to "Yes" to close the table immediately. Otherwise, the table will close when the current hand is finished.
  - paragraph [ref=e593]: RingGamesOnline - puts the ring game specified by the Name parameter (required) into an online state, making it available for play.
  - paragraph [ref=e594]: RingGamesOpen - opens a ring game table in the player client for the specified player (who must already be logged in). Specify the ring game by the Name parameter (required) and the player by the Player parameter (required).
  - paragraph [ref=e595]: RingGamesPause - pauses an online ring game specified by the Name parameter (required). Set parameter Now to "Yes" (the default) to pause the table immediately or to "No" to pause it once the current hand completes.
  - paragraph [ref=e596]: "RingGamesPlaying - retrieves the list of seated players for the ring game specified by the Name parameter (required). The Away field shows the number of minutes that a player has been sitting out. A sample response may look something like this (JSON format):"
  - generic [ref=e597]: "{\"Result\":\"Ok\",\"Count\":2,\"Player\":[\"Aces123\",\"BoneCrusher\"],\"Seat\":[2,7],\"Chips\":[430,650],\"Net\":[-70,150],\"Away\":[0,0]}"
  - paragraph [ref=e598]: "or in legacy format:"
  - generic [ref=e599]: Result=Ok Player1=Aces123 Seat1=2 Chips1=430 Net1=-70 Away1=0 Player2=BoneCrusher Seat2=7 Chips2=650 Net2=150 Away2=0 Count=2
  - paragraph [ref=e600]: RingGamesResume - resumes a paused ring game specified by the Name parameter (required).
  - paragraph [ref=e601]: RingGamesStart - manually starts the ring game specified by the Name parameter (required). The table must be in waiting mode with at least two ready players seated.
  - paragraph [ref=e602]: "RingGamesWaiting - retrieves the list of players in the waiting list for the ring game specified by the Name parameter (required). A sample response will look something like this (JSON format):"
  - generic [ref=e603]: "{\"Result\":\"Ok\",\"Count\":3,\"Wait\":[\"Aces123\",\"BoneCrusher\",\"Wizard\"]}"
  - paragraph [ref=e604]: "or in legacy format:"
  - generic [ref=e605]: Result=Ok Count=3 Wait1=Aces123 Wait2=BoneCrusher Wait3=Wizard
  - heading "♣ System Commands" [level=4] [ref=e606]
  - paragraph [ref=e607]: "SystemAccount - This command allows you to get or change the primary balance of a house account, specified by the Account parameter (\"Master\", \"Ring\", \"Rake\", \"Tourney\", or \"EntryFee\"). Set an Action parameter (\"Set\", \"Inc\", or \"Dec\") along with an Amount parameter to set, increment, or decrement the specified account by that amount. To retrieve the current balance, set Action to \"Get\" (Amount parameter not used in this case). The result will contain a Balance parameter indicating the new balance and a Change parameter indicating the difference between the previous balance and the new balance. In JSON format, a typical result will look something like this:"
  - generic [ref=e608]: "{\"Result\":\"Ok\",\"Balance\":123456,\"Change\":-1000}"
  - paragraph [ref=e609]: "or in legacy format:"
  - generic [ref=e610]: Result=Ok Balance=123456 Change=-1000
  - paragraph [ref=e611]: "SystemAccount2 - This command allows you to get or change the secondary balance of a house account, specified by the Account parameter (\"Master2\", \"Ring2\", \"Rake2\", \"Tourney2\", or \"EntryFee2\"). Set an Action parameter (\"Set\", \"Inc\", or \"Dec\") along with an Amount parameter to set, increment, or decrement the specified account by that amount. To retrieve the current balance, set Action to \"Get\" (Amount parameter not used in this case). The result will contain a Balance parameter indicating the new balance and a Change parameter indicating the difference between the previous balance and the new balance. In JSON format, a typical result will look something like this:"
  - generic [ref=e612]: "{\"Result\":\"Ok\",\"Balance\":123456,\"Change\":-1000}"
  - paragraph [ref=e613]: "or in legacy format:"
  - generic [ref=e614]: Result=Ok Balance=123456 Change=-1000
  - paragraph [ref=e615]: "SystemBalance - This command returns the current primary balance of all house accounts plus the sum total of all player accounts. A House parameter is also returned with the total of all house accounts (not including the Players account). There are no calling parameters for this command. A typical result will look like this in JSON format:"
  - generic [ref=e616]: "{\"Result\":\"Ok\",\"Master\":123456,\"Ring\":1000,\"Rake\":10,\"Tourney\":2000,\"EntryFee\":20,\"House\":126486,\"Players\":123456789}"
  - paragraph [ref=e617]: "or in legacy format:"
  - generic [ref=e618]: Result=Ok Master=123456 Ring=1000 Rake=10 Tourney=2000 EntryFee=20 House=126486 Players=123456789
  - paragraph [ref=e619]: "SystemBalance2 - This command returns the current secondary balance of all house accounts plus the sum total of all player accounts. A House parameter is also returned with the total of all house accounts (not including the Players account). There are no calling parameters for this command. A typical result will look like this in JSON format:"
  - generic [ref=e620]: "{\"Result\":\"Ok\",\"Master2\":123456,\"Ring2\":1000,\"Rake2\":10,\"Tourney2\":2000,\"EntryFee2\":20,\"House2\":126486,\"Players2\":123456789}"
