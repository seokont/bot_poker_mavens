    - listitem [ref=e536]: Game - specify "Limit Hold'em", "Pot Limit Hold'em", "No Limit Hold'em", "Cap Limit Hold'em", "Pot Limit 6+Hold'em", "No Limit 6+Hold'em", "Cap Limit 6+Hold'em", "Limit Omaha", "Pot Limit Omaha", "No Limit Omaha", "Cap Limit Omaha", "Limit Omaha Hi-Lo", "Pot Limit Omaha Hi-Lo", "No Limit Omaha Hi-Lo", "Cap Limit Omaha Hi-Lo", "Limit Omaha-5", "Pot Limit Omaha-5", "No Limit Omaha-5", "Cap Limit Omaha-5", "Limit Omaha-5 Hi-Lo", "Pot Limit Omaha-5 Hi-Lo", "No Limit Omaha-5 Hi-Lo", "Cap Limit Omaha-5 Hi-Lo", "Limit Omaha-6", "Pot Limit Omaha-6", "No Limit Omaha-6", "Cap Limit Omaha-6", "Limit Omaha-6 Hi-Lo", "Pot Limit Omaha-6 Hi-Lo", "No Limit Omaha-6 Hi-Lo", "Cap Limit Omaha-6 Hi-Lo", "Limit Courchevel", "Pot Limit Courchevel", "No Limit Courchevel", "Cap Limit Courchevel", "Limit Courchevel Hi-Lo", "Pot Limit Courchevel Hi-Lo", "No Limit Courchevel Hi-Lo", "Cap Limit Courchevel Hi-Lo", "Limit Razz", "Limit Stud", "Limit Stud Hi-Lo", "Mixed", "Mixed Choice"
    - listitem [ref=e537]: MixedList - if Game is set to "Mixed" then this field must contain a comma-separated list of two or more game types
    - listitem [ref=e538]: MixedHands - number of hands in mixed rounds, 0 to 1000
    - listitem [ref=e539]: PW - (optional) specify a password needed to take a seat
    - listitem [ref=e540]: Private - set to "Yes" to prevent observing without the password or "No" to allow observers
    - listitem [ref=e541]: PermPlay - play permission token, 15 alphanumeric characters max
    - listitem [ref=e542]: PermObserve - observe permission token, 15 alphanumeric characters max
    - listitem [ref=e543]: PermPlayerChat - player chat permission token, 15 alphanumeric characters max
    - listitem [ref=e544]: PermObserverChat - observer chat permission token, 15 alphanumeric characters max
    - listitem [ref=e545]: SuspendChatAllIn - either "Yes" or "No"
    - listitem [ref=e546]: Seats - number of seats, from 2 to 10
    - listitem [ref=e547]: StartMin - 2 to 10
    - listitem [ref=e548]: StartCode 0 to 999999
    - listitem [ref=e549]: PrimaryCurrency - Yes for primary currency or No for secondary currency
    - listitem [ref=e550]: SmallestChip - 0.01, 0.05, 0.25, 1, 5, 25, 100, 500, 1000, 5000, 25000, 100000, 500000, 1000000, 5000000, 25000000, 100000000, 500000000, 1000000000
    - listitem [ref=e551]: BuyInMin - number of chips
    - listitem [ref=e552]: BuyInMax - number of chips
    - listitem [ref=e553]: BuyInDef - number of chips
    - listitem [ref=e554]: CapLimit - number of chips for CL games
    - listitem [ref=e555]: RakePercent - percent number (Pro/Gold feature)
    - listitem [ref=e556]: RakeCap - number of chips, or 0 for no cap (Pro/Gold feature)
    - listitem [ref=e557]: TurnClock - number of seconds, from 10 to 120
    - listitem [ref=e558]: TurnWarning - number of seconds, from 5 to 119
    - listitem [ref=e559]: TimeBank - number of seconds, from 0 to 600
    - listitem [ref=e560]: BankSync - "Yes" or "No"
    - listitem [ref=e561]: BankReset - number of hands, from 0 to 999999
    - listitem [ref=e562]: DisconBank - 0 to 180 seconds
    - listitem [ref=e563]: SmallBlind - number of chips
    - listitem [ref=e564]: BigBlind - number of chips
    - listitem [ref=e565]: AllowStraddle - "Yes" or "No"
    - listitem [ref=e566]: SmallBet - number of chips
    - listitem [ref=e567]: BigBet - number of chips
    - listitem [ref=e568]: Ante - number of chips
    - listitem [ref=e569]: AnteAll - "Yes" or "No"
    - listitem [ref=e570]: BringIn - number of chips
    - listitem [ref=e571]: DupeIPs - set to "Yes" or "No" to allow or disallow players with the same IP address at the table
    - listitem [ref=e572]: RatholeMinutes - number of minutes, from 0 to 120
    - listitem [ref=e573]: RunItTwice - "Yes" or "No"
    - listitem [ref=e574]: SitoutMinutes - number of minutes, from 1 to 120
    - listitem [ref=e575]: SitoutRelaxed - set to "Yes" or "No"
    - listitem [ref=e576]: TableGraphic - set to full path for the table graphic. Leave blank for default site table graphic.
    - listitem [ref=e577]: "TableColorOn - #rrggbb format, leave blank for default."
    - listitem [ref=e578]: "TableColorOff - #rrggbb format, leave blank for default."
