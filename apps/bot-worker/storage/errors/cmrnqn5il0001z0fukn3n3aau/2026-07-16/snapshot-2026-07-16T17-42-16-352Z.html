<script type="text/javascript">

document.addEventListener("DOMContentLoaded", () => {
  const timer = setInterval(() => {
    const openTable = document.getElementById('OpenTableControls');
    const btn = document.querySelector('#mControlsHideBtn button');

    if (openTable && btn) {
      const style = getComputedStyle(openTable);

      // умова: елемент існує і він не прихований
      if (!style.display || style.display !== 'none') {
        // мобільний варіант: викликаємо обробник напряму
        if (typeof btn.onclick === 'function') {
          btn.onclick();
        } else {
          // імітуємо реальний клік через TouchEvent + MouseEvent
          btn.dispatchEvent(new TouchEvent('touchstart', { bubbles: true, cancelable: true }));
          btn.dispatchEvent(new TouchEvent('touchend', { bubbles: true, cancelable: true }));
          btn.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, view: window }));
          btn.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, view: window }));
          btn.dispatchEvent(new MouseEvent('click', { bubbles: true, view: window }));
        }

        console.log('✅ Кнопка Hide натиснута після того, як OpenTableControls став активним');
        clearInterval(timer); // виконуємо лише один раз
      }
    }
  }, 500); // перевірка кожні 0.5 секунди
});

//----------------------------------------------------------

document.addEventListener("DOMContentLoaded", () => {
  // Проверка на мобильное устройство
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (isMobile) {
    const elem = document.documentElement; // можно заменить на конкретный div

    // Функция для запроса fullscreen
    function requestFullScreen() {
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) { // Safari
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) { // IE/Edge
        elem.msRequestFullscreen();
      }
    }

    // Попытка сразу (часто блокируется)
    requestFullScreen();

    // Если браузер не дал — включаем при первом взаимодействии
    ["touchstart","click"].forEach(evt => {
      document.addEventListener(evt, () => {
        requestFullScreen();
      }, { once: true });
    });
  }
});


//-----------------------------


document.addEventListener("DOMContentLoaded", () => {
  const elem = document.documentElement;
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  // Кнопка
  const btn = document.createElement("button");
  btn.textContent = "Open in full screen mode";
  Object.assign(btn.style, {
    position: "fixed",
    top: "60%",
    left: "50%",
    transform: "translate(-50%, -50%)",
    padding: "20px 40px",
    background: "#007aff",
    color: "#fff",
    border: "none",
    borderRadius: "12px",
    fontSize: "22px",
    fontWeight: "bold",
    cursor: "pointer",
    zIndex: "9999"
  });

  // Повідомлення
  const msg = document.createElement("div");
  msg.textContent = "Please turn your phone to landscape position 📱➡️📺";
  Object.assign(msg.style, {
    display: "none",
    position: "fixed",
    bottom: "20px",
    left: "50%",
    transform: "translateX(-50%)",
    background: "rgba(0,0,0,0.7)",
    color: "#fff",
    padding: "10px 20px",
    borderRadius: "8px",
    fontSize: "16px"
  });

  document.body.appendChild(btn);
  document.body.appendChild(msg);

  async function requestFullScreen() {
    if (elem.requestFullscreen) {
      return elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) {
      return elem.webkitRequestFullscreen();
    }
  }

  btn.addEventListener("click", async () => {
    try {
      await requestFullScreen();

      if (!isIOS && screen.orientation && screen.orientation.lock) {
        try {
          await screen.orientation.lock("landscape");
        } catch (err) {
          console.warn("Не вдалося змінити орієнтацію:", err);
        }
      } else {
        msg.style.display = "block"; // показати повідомлення на iOS
      }

      btn.remove();
    } catch (err) {
      console.error("Fullscreen error:", err);
    }
  });

  // Слухаємо зміну орієнтації або розміру
  function checkOrientation() {
    const landscape = window.innerWidth > window.innerHeight;
    msg.style.display = landscape ? "none" : "block";
  }

  window.addEventListener("orientationchange", checkOrientation);
  window.addEventListener("resize", checkOrientation);
});

document.addEventListener("DOMContentLoaded", () => {
  function getScale(transform) {
    const m = transform.match(
      /matrix\(([-\d.]+),\s*([-\d.]+),\s*([-\d.]+),\s*([-\d.]+)/,
    );
    if (!m) return null;
    return { scaleX: parseFloat(m[1]), scaleY: parseFloat(m[4]) };
  }
